name: menvi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menvi
      POSTGRES_PASSWORD: menvi
      POSTGRES_DB: menvi
    ports:
      - '5432:5432'
    volumes:
      - menvi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U menvi']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - menvi_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menvi_pg:
  menvi_redis:
