[project]
name = "menvi-platform"
version = "0.1.0"
description = "Menvi — plataforma SaaS para restaurantes parceiros (M2 Solutions)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PL", "RUF"]
ignore = [
    "E501",     # line length (black/ruff format cuidam)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic number
    "B008",     # mutable default in call (Depends do FastAPI)
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements (seed)
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E", "W", "F", "I", "UP"]
"apps/api/seed.py" = ["PLR0915"]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "single"

[tool.black]
line-length = 120
target-version = ["py311"]
skip-string-normalization = true
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.versions.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
