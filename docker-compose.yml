services:
  postgres:
    image: postgres:16-alpine
    container_name: menvi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: menvi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - menvi_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: menvi-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - menvi_redis_data:/data

volumes:
  menvi_postgres_data:
  menvi_redis_data:
