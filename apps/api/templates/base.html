<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Menvi Platform{% endblock %}</title>
    <style>
      :root {
        --bg: #0b1020;
        --surface: rgba(255, 255, 255, 0.07);
        --surface-strong: rgba(255, 255, 255, 0.12);
        --text: #ecf2ff;
        --muted: #a9b5d6;
        --primary: #7c5cff;
        --primary-2: #00c2ff;
        --success: #14b86a;
        --danger: #ff5c7c;
        --border: rgba(255, 255, 255, 0.16);
        --shadow: 0 20px 50px rgba(2, 6, 23, 0.45);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 0% -20%, #2b1b68 0%, transparent 50%),
          radial-gradient(800px 500px at 100% 0%, #0a4a73 0%, transparent 55%),
          var(--bg);
      }

      .shell {
        max-width: 1080px;
        margin: 28px auto;
        padding: 0 20px 24px;
      }

      .topbar {
        position: sticky;
        top: 12px;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(8, 12, 30, 0.75);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .brand-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        box-shadow: 0 0 0 6px rgba(124, 92, 255, 0.18);
      }

      .nav { display: flex; gap: 8px; flex-wrap: wrap; }

      .nav a {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
        font-size: 14px;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid transparent;
        transition: all .18s ease;
      }

      .nav a:hover,
      .nav a.active {
        border-color: var(--border);
        background: var(--surface);
      }

      .panel {
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-inner { padding: 24px; }

      h1 { margin: 0 0 8px; font-size: clamp(30px, 4vw, 42px); letter-spacing: .2px; }
      h2 { margin: 0 0 8px; font-size: 24px; }
      p { color: var(--muted); line-height: 1.6; }

      .muted { color: var(--muted); }

      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .card {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 14px;
        padding: 14px;
      }

      .card h3 { margin: 0 0 8px; }

      .price { font-weight: 700; color: #fff; }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .btn {
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 10px 14px;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: transform .12s ease, opacity .12s ease, background .18s ease;
      }

      .btn:active { transform: translateY(1px); }
      .btn-primary { background: linear-gradient(135deg, var(--primary), #a76bff); }
      .btn-secondary { background: var(--surface-strong); border-color: var(--border); }
      .btn-success { background: linear-gradient(135deg, #0ba360, #14b86a); }

      .input, .select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 12px;
        background: rgba(5,8,20,.45);
        color: #fff;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 12px;
        overflow: hidden;
      }

      .table th,
      .table td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.pending { background: rgba(255, 196, 0, .2); color: #ffd35d; }
      .badge.ok { background: rgba(20, 184, 106, .2); color: #72ffb9; }

      .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
      .kpi { padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
      .kpi strong { font-size: 22px; display: block; margin-top: 6px; }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: rgba(10, 16, 40, .92);
        border: 1px solid var(--border);
        color: #fff;
        padding: 12px 14px;
        border-radius: 12px;
        transform: translateY(20px);
        opacity: 0;
        pointer-events: none;
        transition: all .25s ease;
      }

      .toast.show { transform: translateY(0); opacity: 1; }

      @media (max-width: 720px) {
        .topbar { flex-direction: column; align-items: flex-start; }
        .panel-inner { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-dot"></span> Menvi Platform</div>
        <nav class="nav">
          <a href="/" data-nav="menu">Menu</a>
          <a href="/menu/products" data-nav="produtos">Produtos</a>
          <a href="/crm/login" data-nav="crm">CRM</a>
          <a href="/docs" target="_blank" rel="noreferrer">API Docs</a>
        </nav>
      </header>

      <main class="panel">
        <div class="panel-inner">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script>
      const current = location.pathname;
      document.querySelectorAll('.nav a[data-nav]').forEach((a) => {
        if (current.startsWith('/crm') && a.dataset.nav === 'crm') a.classList.add('active');
        if (current.startsWith('/menu') && ['menu', 'produtos'].includes(a.dataset.nav)) a.classList.add('active');
        if (current === '/' && a.dataset.nav === 'menu') a.classList.add('active');
      });

      window.showToast = (message) => {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      };
    </script>
  </body>
</html>
