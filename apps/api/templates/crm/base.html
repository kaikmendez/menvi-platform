<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CRM | Menvi{% endblock %}</title>
    <style>
      :root {
        --bg: #f3f5f9;
        --surface: #ffffff;
        --text: #1f2a37;
        --muted: #7a889d;
        --border: #e4e8ef;
        --primary: #2f6fed;
        --success: #16a56b;
        --warning: #d89a1d;
        --danger: #dd6363;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
      .topbar {
        height: 58px; border-bottom: 1px solid var(--border); background: #fff;
        display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 10;
      }
      .brand { font-weight: 800; color: #2ea66d; }
      .content { max-width: 1120px; margin: 18px auto; padding: 0 14px 24px; }
      .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .page-head h2 { margin: 0; font-size: 38px; }
      .btn {
        border: 1px solid var(--border); border-radius: 12px; background: #fff;
        padding: 10px 14px; cursor: pointer; font-weight: 700; color: #566176;
      }
      .kpis { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 12px; margin: 12px 0; }
      .kpi { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
      .kpi span { color: var(--muted); font-size: 14px; }
      .kpi strong { display: block; font-size: 34px; margin-top: 6px; }
      .kpi.warning strong { color: var(--warning); }
      .kpi.processing strong { color: var(--success); }
      .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
      .chip { border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 7px 12px; font-weight: 700; color: #748096; font-size: 13px; }
      .chip.active { background: #dff5e9; color: #30a870; border-color: #caebdb; }
      .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 10px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .code { font-weight: 700; color: #8ea0b7; }
      .badge { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
      .badge.pending { color: #b77c0f; background: #fff3dd; }
      .order-items { margin-top: 10px; background: #f5f7fb; border-radius: 12px; padding: 10px; }
      .actions { display: flex; gap: 8px; margin-top: 10px; }
      .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
      .btn-danger { background: #fff; color: var(--danger); border-color: #f2c7c7; }
      @media (max-width: 860px) {
        .kpis { grid-template-columns: 1fr; }
        .page-head h2 { font-size: 30px; }
      }
    </style>
  </head>
  <body>
    <header class="topbar"><div class="brand">⚡ WPP AI</div></header>
    <main class="content">{% block content %}{% endblock %}</main>
  </body>
</html>
