<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CRM | Menvi{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/crm.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">Menvi CRM</div>
        <nav class="menu">
          <a href="/crm/dashboard" data-nav="dashboard">Pedidos</a>
          <a href="/crm/orders" data-nav="orders">Fila detalhada</a>
          <a href="/crm/customers" data-nav="customers">Clientes</a>
          <a href="/crm/products" data-nav="products">Produtos</a>
          <a href="#" data-nav="settings">Configurações (teste)</a>
          <a href="#" data-nav="reports">Relatórios (teste)</a>
          <a href="/crm/login" data-nav="logout">Sair</a>
        </nav>
      </aside>
      <section class="content">
        <header class="topbar">
          <strong>⚡ WPP AI</strong>
          <span class="title">Painel do restaurante</span>
        </header>
        <div class="panel">{% block content %}{% endblock %}</div>
      </section>
    </div>
    <script src="/static/js/crm-base.js"></script>
  </body>
</html>
