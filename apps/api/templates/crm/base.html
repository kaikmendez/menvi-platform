<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CRM | Menvi{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/crm.css?v=20260420" />
  </head>
  <body>
    <div class="crm-bg"></div>
    <div class="layout">
      <aside class="sidebar">
        <div>
          <div class="logo-wrap">
            <div class="logo-mark">M</div>
            <div>
              <div class="logo">Menvi CRM</div>
              <small>Operação de pedidos</small>
            </div>
          </div>

          <nav class="menu">
            <a href="/crm/dashboard" data-nav="dashboard">Visão geral</a>
            <a href="/crm/orders" data-nav="orders">Fila operacional</a>
            <a href="/crm/customers" data-nav="customers">Clientes</a>
            <a href="/crm/products" data-nav="products">Produtos</a>
          </nav>
        </div>

        <a href="/crm/login" class="menu-logout" data-nav="logout">Sair</a>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <strong>Restaurante Demo</strong>
            <p class="muted">Central operacional de pedidos</p>
          </div>
          <div class="topbar-actions">
            <span class="pill success">Loja aberta</span>
            <span class="pill">Entrega ativa</span>
          </div>
        </header>
        <div class="panel">{% block content %}{% endblock %}</div>
      </section>
    </div>
    <script src="/static/js/crm-base.js?v=20260420"></script>
  </body>
</html>
