{% extends 'crm/base.html' %}
{% block title %}Fila operacional | CRM{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h2>Fila detalhada de pedidos</h2>
    <p class="muted">Visualização operacional completa com tempo decorrido e ações rápidas.</p>
  </div>
  <button class="btn" id="orders-refresh" type="button">⟳ Atualizar fila</button>
</div>

<div class="filters" style="margin-bottom: 8px;">
  <button class="chip active" data-filter="ALL">Todos</button>
  <button class="chip" data-filter="PENDING">Pendentes</button>
  <button class="chip" data-filter="PREPARING">Preparando</button>
  <button class="chip" data-filter="READY">Prontos</button>
  <button class="chip" data-filter="DELIVERED">Entregues</button>
</div>

<div class="table-wrap">
  <table class="table" id="orders-table">
    <thead>
      <tr>
        <th>Pedido</th>
        <th>Cliente</th>
        <th>Status</th>
        <th>Valor</th>
        <th>Horário</th>
        <th>Tempo</th>
        <th>Tipo</th>
        <th>Pagamento</th>
        <th>Itens</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="orders-table-body"></tbody>
  </table>
</div>

<div class="modal-backdrop" id="order-modal-backdrop" hidden>
  <div class="modal-card" id="order-modal"></div>
</div>

<script src="/static/js/crm-orders.js"></script>
{% endblock %}
