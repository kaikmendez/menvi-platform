{% extends 'crm/base.html' %}
{% block title %}Produtos | CRM{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h2>Gestão de produtos</h2>
    <p class="muted">Controle disponibilidade do cardápio com ações rápidas.</p>
  </div>
  <button class="btn" id="products-refresh" type="button">⟳ Atualizar</button>
</div>

<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>Produto</th>
        <th>Categoria</th>
        <th>Preço</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="products-table-body"></tbody>
  </table>
</div>

<script src="/static/js/crm-products.js"></script>
{% endblock %}
