<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login CRM | Menvi</title>
    <link rel="stylesheet" href="/static/css/crm.css" />
  </head>
  <body>
    <div class="crm-login-shell">
      <section class="crm-login-panel premium">
        <div class="login-brand">
          <div class="logo-mark">M</div>
          <div>
            <strong>Menvi CRM</strong>
            <p>Painel exclusivo para restaurantes parceiros.</p>
          </div>
        </div>

        <h1>Bem-vindo de volta</h1>
        <p>Acesse sua central para acompanhar pedidos, clientes e cardápio em tempo real operacional.</p>

        <div class="crm-login-card">
          <label class="muted" for="email">E-mail</label>
          <input id="email" class="crm-login-input" placeholder="E-mail" value="admin@menvi.com" />

          <label class="muted" for="password" style="display:block; margin-top:10px;">Senha</label>
          <input id="password" class="crm-login-input" type="password" placeholder="Senha" value="123456" />

          <button id="loginBtn" class="crm-login-btn">Entrar no CRM</button>
          <p class="muted" style="margin-top:10px;">Credenciais demo: <strong>admin@menvi.com</strong> / <strong>123456</strong>.</p>
        </div>
      </section>
    </div>

    <div id="toast" class="toast">Login realizado com sucesso</div>
    <script src="/static/js/crm-login.js"></script>
  </body>
</html>
