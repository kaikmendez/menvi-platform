{% extends 'base.html' %}
{% block title %}Login CRM | Menvi{% endblock %}
{% block content %}
<h2>Login do Restaurante</h2>
<p>Acesso exclusivo para equipe do restaurante.</p>

<div class="card" style="max-width:520px; margin-top:12px;">
  <p class="muted">Teste: <strong>admin@menvi.com</strong> / <strong>123456</strong></p>
  <div class="grid" style="grid-template-columns:1fr 1fr; margin-top:8px;">
    <input class="input" id="email" placeholder="E-mail" value="admin@menvi.com" />
    <input class="input" id="password" type="password" placeholder="Senha" value="123456" />
  </div>
  <button class="btn btn-primary" style="margin-top:12px;" onclick="window.location.href='/crm/dashboard'">Entrar no CRM</button>
</div>
{% endblock %}
