<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login CRM | Menvi</title>
    <link rel="stylesheet" href="/static/css/crm.css" />
  </head>
  <body>
    <div class="crm-login-shell">
      <div class="crm-login-top">Menvi CRM</div>
      <section class="crm-login-panel">
        <h1>Login CRM</h1>
        <p>Acesso exclusivo para o restaurante gerenciar pedidos.</p>

        <div class="crm-login-card">
          <p>Credenciais de teste: <strong>admin@menvi.com</strong> / <strong>123456</strong>.</p>
          <div class="crm-login-row">
            <input id="email" class="crm-login-input" placeholder="E-mail" value="admin@menvi.com" />
            <input id="password" class="crm-login-input" type="password" placeholder="Senha" value="123456" />
          </div>
          <button id="loginBtn" class="crm-login-btn">Entrar</button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast">Autenticação simulada com sucesso</div>
    <script src="/static/js/crm-login.js"></script>
  </body>
</html>
